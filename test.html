<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>TradingView 위젯 테스트</title>
<style>
body{margin:0;padding:24px;background:#0a1424;color:#e9eef6;font-family:system-ui,"Malgun Gothic",sans-serif}
h2{font-size:16px;font-weight:600;margin:24px 0 8px}
.box{max-width:720px;border:1px solid #22324d;border-radius:10px;overflow:hidden}
p{color:#a9b8cf;font-size:14px;max-width:720px;line-height:1.6}
</style>
</head>
<body>
<p>아래 두 칸에 각각 차트가 보이는지 확인하는 테스트 페이지입니다. 1번은 일본 종목, 2번은 비교용 미국 종목입니다.</p>

<h2>1. 일본 — 패스트리테일링 (TSE:9983)</h2>
<div class="box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
    {"symbol": "TSE:9983", "width": "100%", "height": 300, "locale": "kr", "dateRange": "12M", "colorTheme": "dark", "isTransparent": false, "autosize": false}
    </script>
  </div>
</div>

<h2>2. 비교용 — 애플 (NASDAQ:AAPL)</h2>
<div class="box">
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
    {"symbol": "NASDAQ:AAPL", "width": "100%", "height": 300, "locale": "kr", "dateRange": "12M", "colorTheme": "dark", "isTransparent": false, "autosize": false}
    </script>
  </div>
</div>
</body>
</html>
