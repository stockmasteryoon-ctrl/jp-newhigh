<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>일본 신고가 근접 · 시총 상위</title>
<style>
:root{
  --bg:#0a1424; --card:#111f35; --line:#22324d; --line2:#2e4163;
  --tx:#e9eef6; --tx2:#a9b8cf; --tx3:#7d8da6;
  --blue:#3987e5; --blue-soft:#2a5fa8; --orange:#d95926;
  --good:#0ca30c; --good-bg:#0f2e1c; --warn:#fab219; --warn-bg:#33290d; --neutral-bg:#1b2a44;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-variant-numeric:tabular-nums}
#deck{height:100vh;overflow-y:auto;scroll-snap-type:y proximity;scroll-behavior:smooth}
section{min-height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;padding:28px 20px 56px}
.wrap{width:100%;max-width:1120px}
h1{font-size:30px;font-weight:650;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:26px;font-weight:650;margin:0;letter-spacing:-.01em}
.sub{color:var(--tx2);font-size:14px;line-height:1.6}
.muted{color:var(--tx3);font-size:12px;line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:22px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{color:var(--tx2);font-size:13px}
.tile .v{font-size:26px;font-weight:650;margin-top:4px}
.tile .n{color:var(--tx3);font-size:12px;margin-top:2px}
.cols{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){.cols{grid-template-columns:1fr 1fr}}
.secrow{display:grid;grid-template-columns:96px 1fr 34px;align-items:center;gap:10px;font-size:13px;margin:7px 0;color:var(--tx2)}
.secbar{height:14px;background:var(--blue);border-radius:0 4px 4px 0;min-width:2px}
.secrow b{color:var(--tx);font-weight:600;text-align:right}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--tx3);font-weight:500;font-size:12px}
td.l,th.l{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:#16284a}
.pos{color:#ff8f8f}.neg{color:#7fb2ff}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.code{color:var(--tx3);font-size:16px;font-weight:500;margin-left:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--neutral-bg);color:var(--tx2);border:1px solid var(--line2)}
.chip.good{background:var(--good-bg);color:#7fe07f;border-color:#1d5a34}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:#5a4713}
.kpis{display:flex;gap:22px;flex-wrap:wrap;text-align:right}
.kpi .k{color:var(--tx3);font-size:12px}
.kpi .v{font-size:20px;font-weight:650}
ul.intro{margin:16px 0 18px;padding-left:18px;line-height:1.75;font-size:15px}
ul.intro li::marker{color:var(--tx3)}
.ctitle{font-size:13px;color:var(--tx2);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
.chartbox{background:#0d1a2e;border:1px solid var(--line);border-radius:10px;padding:12px 12px 8px;position:relative}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{font-family:inherit;font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:#06101f;border:1px solid var(--line2);border-radius:8px;padding:6px 9px;font-size:12px;color:var(--tx);white-space:nowrap;display:none;z-index:5}
.note{margin-top:12px}
.egrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.egrid{grid-template-columns:repeat(3,1fr)}}
.ecard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 10px}
.etop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.enm{font-size:16px;font-weight:650}.enm span{color:var(--tx3);font-size:11.5px;font-weight:500;margin-left:6px}
.epx{font-size:14px;font-weight:600}
.erets{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--tx3);margin:3px 0 4px}
.erets b{font-weight:600;color:var(--tx)}.erets b.pos{color:#ff8f8f}.erets b.neg{color:#7fb2ff}
.ehold{font-size:11.5px;color:var(--tx3);margin-top:5px;border-top:1px solid var(--line);padding-top:6px;line-height:1.5}
.ehold b{color:var(--tx2);font-weight:500}
.etag{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);margin-left:6px;font-weight:500}
.etag.good{background:var(--good-bg);color:#7fe07f;border-color:#1d5a34}
.wrap.wide{max-width:1320px}
.pmap{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12.5px}
.pmap th{font-size:12px;color:var(--tx2);font-weight:500;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line2);white-space:normal}
.pmap th small{display:block;color:var(--tx3);font-weight:400}
.pmap td{vertical-align:top;padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:normal}
.pmap tbody tr{cursor:default}.pmap tbody tr:hover{background:none}
.pmap tr.best td{background:#0f2333}
.pmap .gn{font-weight:650;font-size:13.5px}.pmap .gs{color:var(--tx3);font-size:11px}
.pstar{display:inline-block;font-size:10.5px;color:#7fe07f;border:1px solid #1d5a34;background:var(--good-bg);border-radius:999px;padding:0 6px;margin-left:5px;font-weight:500;white-space:nowrap}
.pc{display:inline-block;margin:2px 4px 2px 0;padding:1px 7px;border-radius:7px;background:#16243c;border:1px solid var(--line);color:#c6d2e6;white-space:nowrap;cursor:pointer}
.pc i{font-style:normal;color:var(--tx3);margin-left:5px;font-size:11px}
.pc b{font-weight:500;margin-left:5px;font-size:11px}
.pc b.u{color:#ff8f8f}.pc b.d{color:#7fb2ff}.pc b.e{color:var(--warn)}
.pc.s{background:var(--good-bg);border-color:#2c8a4c;color:var(--tx)}.pc.s i{color:#7fe07f}
.plg{display:flex;gap:6px 16px;flex-wrap:wrap;color:var(--tx2);font-size:11.5px;margin:8px 0;align-items:center}


.chip.a{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
dl.tx{margin:14px 0;display:grid;grid-template-columns:92px 1fr;gap:6px 12px;font-size:14px;line-height:1.6}
dl.tx dt{color:var(--tx3);font-size:12.5px;padding-top:2px}dl.tx dd{margin:0;color:var(--tx)}
dl.tx .u{color:#ff8f8f;font-weight:600}dl.tx .dn{color:#7fb2ff;font-weight:600}dl.tx .a{color:var(--warn);font-weight:700}dl.tx .k{color:var(--tx2)}
.lg{white-space:nowrap}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 10px;vertical-align:-1px}
.opm{display:flex;font-size:11.5px;color:var(--tx2);text-align:center;margin-top:4px}.opm b{color:var(--tx);font-weight:600}.opm span{text-align:left;color:var(--tx3);white-space:nowrap;overflow:visible}
@media(max-width:700px){dl.tx{grid-template-columns:1fr}.lg{display:none}}

section.etfp{min-height:0;padding:14px 20px 28px;scroll-snap-align:none}dl.tx .o{color:#5cc4c0;font-weight:600}
dl.tx .li{position:relative;padding-left:14px}dl.tx .li::before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--tx3)}
.rs{display:inline-block;font-size:13px;font-weight:650;padding:2px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--tx2);margin-right:10px;vertical-align:4px;letter-spacing:0}
.rs.hi{background:var(--good-bg);color:#7fe07f;border-color:#1d5a34}
dl.tx .li.beat{background:var(--warn-bg);border:1px solid #5a4713;border-radius:8px;padding:2px 10px 2px 22px;margin:2px 0 0 -9px;display:inline-block}
dl.tx .li.beat::before{left:10px;background:var(--warn)}
dl.tx .bt{color:var(--warn);font-weight:700}
.fav{background:none;border:0;color:var(--tx3);font-size:24px;line-height:1;cursor:pointer;padding:0 8px 0 0;vertical-align:-1px}
.fav:hover{color:var(--warn)}.fav.on{color:var(--warn)}
.pw{display:inline-block;position:relative;padding-left:15px;margin-right:2px}.pw .pc{margin-right:0}
.pw .st{position:absolute;left:0;top:50%;transform:translateY(-50%);background:none;border:0;padding:0;font-size:12px;line-height:1;cursor:pointer;color:transparent}
.pw:hover .st{color:var(--line2)}.pw.fv .st,.pw.fv:hover .st{color:var(--warn)}

#nav{position:fixed;right:18px;bottom:14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--tx3);
  background:rgba(10,20,36,.85);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
#nav button{background:none;border:1px solid var(--line2);color:var(--tx2);border-radius:999px;width:26px;height:26px;cursor:pointer;font-size:13px}
#nav button:hover{background:#16284a}
.empty{color:var(--tx3);font-size:13px;padding:40px 8px;text-align:center}
.ath{display:inline-block;font-size:12.5px;font-weight:650;letter-spacing:0;padding:3px 10px;border-radius:999px;margin-left:10px;vertical-align:4px;color:var(--warn);border:1px solid var(--warn);background:var(--warn-bg)}
</style>
</head>
<body>
<main id="deck"><section><div class="wrap"><p class="sub">데이터를 불러오는 중…</p></div></section></main>
<div id="nav"><button id="prev" aria-label="이전">↑</button><span id="pos">–</span><button id="next" aria-label="다음">↓</button><span>방향키로 이동</span></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (v, d = 1) => v == null ? '–' : (v > 0 ? '+' : '') + (v * 100).toFixed(d) + '%';
const cls = v => v == null ? '' : v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const num = v => v == null ? '–' : v.toLocaleString('ko-KR', {maximumFractionDigits: v < 1000 ? 1 : 0});
// 십억엔 → 조엔/억엔 표기
const yen = bn => bn == null ? 'n/a' : Math.abs(bn) >= 1000 ? (bn / 1000).toFixed(2) + '조' : Math.round(bn * 10).toLocaleString('ko-KR') + '억';
let WEEKLY = false;
const C = {blue:'#3987e5', orange:'#d95926', grid:'#22324d', tx2:'#a9b8cf', tx3:'#7d8da6', tx:'#e9eef6', good:'#0ca30c', rev:'#3987e5', op:'#4aa3a0', yoy:'#e0a23a', acc:'#fab219'};

async function load(path) {
  try {
    const r = await fetch(path + '?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

function niceTicks(lo, hi, n) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || 10 * mag;
  const out = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

/* ───────── 주가 차트 (1년, 52주 고가선, 저가 대비 상승폭, 호버 십자선) ───────── */
function priceChart(p) {
  const W = 520, H = 250, L = 52, R = 104, T = 14, B = 26;
  const n = p.c.length, all0 = Math.min(...p.c), c52 = p.c.slice(-53), lo0 = Math.min(...c52), hi0 = Math.max(p.hi52, ...p.c);
  const pad = (hi0 - all0) * 0.08 || 1, lo = all0 - pad, hi = hi0 + pad;
  const x = i => L + (W - L - R) * i / (n - 1), y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let g = '';
  niceTicks(lo, hi, 4).forEach(v => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${C.grid}" stroke-width="1"/>` +
         `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="${C.tx3}">${num(v)}</text>`;
  });
  let lastM = '', lastX = -99;
  p.d.forEach((d, i) => {
    const m = d.slice(0, 7);
    if (m !== lastM) { lastM = m;
      if (i > 0 && x(i) - lastX > 62) { lastX = x(i);
        g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${C.tx3}">${d.slice(2, 4)}.${+d.slice(5, 7)}</text>`; } }
  });
  const path = p.c.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1)).join('');
  const yh = y(p.hi52), yl = y(p.last), near = yl - yh < 13, li = n - c52.length + c52.indexOf(lo0), ylo = y(lo0);
  const yPx = near ? yh + 15 : yl + 4;                       // 현재가 라벨 위치 (고가선 라벨과 겹치면 아래로)
  g += `<line x1="${L}" x2="${W - R}" y1="${yh}" y2="${yh}" stroke="${C.good}" stroke-width="1.2" stroke-dasharray="5 4"/>` +
       `<text x="${W - R + 6}" y="${yh + 3}" font-size="10.5" fill="${C.tx2}">52주 고가</text>` +
       `<path d="${path}" fill="none" stroke="${C.blue}" stroke-width="2" stroke-linejoin="round"/>` +
       `<circle cx="${x(n - 1)}" cy="${yl}" r="4" fill="${C.blue}" stroke="#0d1a2e" stroke-width="2"/>` +
       `<text x="${W - R + 6}" y="${yPx}" font-size="12" font-weight="600" fill="${C.tx}">${num(p.last)}</text>`;
  // 52주 저가 → 현재가 양방향 화살표 (플롯 오른쪽 바깥)
  const ax = W - 74, yc = yPx + 10, up = Math.round((p.last / lo0 - 1) * 100);
  g += `<line x1="${x(li)}" x2="${ax + 5}" y1="${ylo}" y2="${ylo}" stroke="${C.tx3}" stroke-dasharray="2 3"/>`;
  if (ylo - yc > 34) {
    g += `<line x1="${ax}" x2="${ax}" y1="${ylo - 2}" y2="${yc + 2}" stroke="${C.tx3}" stroke-width="1.2"/>` +
         `<path d="M${ax - 4} ${yc + 9}L${ax} ${yc + 2}L${ax + 4} ${yc + 9}M${ax - 4} ${ylo - 9}L${ax} ${ylo - 2}L${ax + 4} ${ylo - 9}" fill="none" stroke="${C.tx3}" stroke-width="1.2"/>` +
         `<text x="${ax + 9}" y="${(ylo + yc) / 2 + 5}" font-size="14" font-weight="700" fill="${C.acc}">+${up}%</text>`;
  } else {
    g += `<text x="${ax + 9}" y="${ylo - 12}" font-size="14" font-weight="700" fill="${C.acc}">+${up}%</text>`;
  }
  g += `<text x="${ax + 9}" y="${ylo + 4}" font-size="10" fill="${C.tx3}">52주 저가 ${num(lo0)}</text>` +
       `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="${C.tx3}" stroke-width="1" visibility="hidden"/>` +
       `<circle class="xd" r="4" fill="${C.blue}" stroke="#0d1a2e" stroke-width="2" visibility="hidden"/>` +
       `<rect class="hit" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
  return {svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="최근 1년 주가">${g}</svg>`, geo: {W, L, R, n, x, y}};
}
function wirePrice(box, p, geo) {
  const svg = $('svg', box), tip = $('.tip', box), xh = $('.xh', box), xd = $('.xd', box), hit = $('.hit', box);
  const move = ev => {
    const r = svg.getBoundingClientRect(), sx = (ev.clientX - r.left) / r.width * geo.W;
    const i = Math.max(0, Math.min(geo.n - 1, Math.round((sx - geo.L) / (geo.W - geo.L - geo.R) * (geo.n - 1))));
    const px = geo.x(i), py = geo.y(p.c[i]);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    xd.setAttribute('cx', px); xd.setAttribute('cy', py); xd.setAttribute('visibility', 'visible');
    tip.innerHTML = `${p.d[i]}${WEEKLY ? ' 주' : ''} · <b>${num(p.c[i])}엔</b>`;
    tip.style.display = 'block';
    const bx = box.getBoundingClientRect(), left = ev.clientX - bx.left + 14;
    tip.style.left = Math.min(left, bx.width - tip.offsetWidth - 8) + 'px';
    tip.style.top = '10px';
  };
  hit.addEventListener('pointermove', move);
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.setAttribute('visibility', 'hidden'); xd.setAttribute('visibility', 'hidden'); });
}

/* ───────── 분기 막대 + YoY 꺾은선 (이중축) + 가이던스 점선 ───────── */
const yy = (v, d = 0) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v * 100).toFixed(d) + '%';
function combo(qs, key, ykey, color, G, opmName) {
  const W = 520, H = 178, L = 40, R = 42, T = 30, B = 22, nq = qs.length, gn = G ? G.n : 0, n = nq + gn;
  const gv = G ? G[key] : null, gy = G ? G[ykey] : null;
  const v = qs.map(q => q[key]), ys = qs.map(q => q[ykey]);
  const all = v.concat(gv == null ? [] : [gv]);
  let hi = Math.max(0, ...all), lo = Math.min(0, ...all); if (hi === 0 && lo === 0) hi = 1;
  hi += (hi - lo) * 0.12; if (lo < 0) lo -= (hi - lo) * 0.06;
  const bw = (W - L - R) / n, x = i => L + bw * (i + .5), y = a => T + (H - T - B) * (1 - (a - lo) / (hi - lo));
  const cl = a => Math.max(-100, Math.min(200, a * 100));     // YoY 축은 −100%~+200%로 자름 (라벨은 실제값)
  const yv = ys.filter(a => a != null).map(cl).concat(gy == null ? [] : [cl(gy)]);
  let y2lo = Math.min(0, ...yv), y2hi = Math.max(0, ...yv); const pad = (y2hi - y2lo) * .18 || 5; y2hi += pad; if (y2lo < 0) y2lo -= pad * .4;
  const y2 = a => T + (H - T - B) * (1 - (a - y2lo) / (y2hi - y2lo));
  const fs = n > 9 ? 9.5 : 11;
  let g = '';
  niceTicks(Math.max(lo, 0), hi / 1.12, 2).slice(0, 4).forEach(a => {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(a)}" y2="${y(a)}" stroke="${C.grid}"/><text x="${L - 6}" y="${y(a) + 3.5}" text-anchor="end" font-size="10" fill="${C.tx3}">${num(a)}</text>`; });
  if (lo < 0) g += `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="${C.tx3}" stroke-width="1"/>`;
  if (yv.length) niceTicks(y2lo < 0 ? y2lo + pad * .4 : 0, y2hi - pad, 3).slice(0, 5).forEach(a => {
    g += `<text x="${W - R + 6}" y="${y2(a) + 3.5}" font-size="10" fill="${C.yoy}">${a > 0 ? '+' : ''}${a}%</text>`; });
  if (gn) g += `<rect x="${L + bw * nq}" y="${T - 18}" width="${bw * gn}" height="${H - T - B + 18}" fill="#16243c" opacity=".7"/>`;
  const bar = (i, val, dash, tt) => {
    const w = bw * .6, x0 = x(i) - w / 2, y0 = y(0), y1 = y(val), r = Math.min(4, Math.abs(y1 - y0), w / 2);
    const d = val >= 0 ? `M${x0} ${y0}V${y1 + r}q0 ${-r} ${r} ${-r}h${w - 2 * r}q${r} 0 ${r} ${r}V${y0}` : `M${x0} ${y0}V${y1 - r}q0 ${r} ${r} ${r}h${w - 2 * r}q${r} 0 ${r} ${-r}V${y0}`;
    return dash ? `<path d="${d}" fill="${color}" fill-opacity=".14" stroke="${color}" stroke-width="1.5" stroke-dasharray="4 3"><title>${tt}</title></path>`
                : `<path d="${d}Z" fill="${color}"><title>${tt}</title></path>`;
  };
  qs.forEach((q, i) => { g += bar(i, v[i], false, `${q.q} ${num(v[i])}십억엔${ys[i] != null ? ' · YY ' + yy(ys[i], 1) : ''}`) +
    `<text x="${x(i)}" y="${H - 6}" text-anchor="middle" font-size="${fs}" fill="${C.tx3}">${q.q}</text>`; });

    return {g, items, att, sg, m1, n: items.length};
  }).filter(r => r.n).sort((a, b) => (b.att / b.n - a.att / a.n) || (b.sg - a.sg) || (b.m1 - a.m1));
  const chip = i => { const f = i.co.fin, dm = i.g.dm;
    const y = f && f.yoy != null ? `<i>${pct(f.yoy, 0)}${dm == null ? '' : dm >= 0.5 ? '↑' : dm <= -0.5 ? '↓' : ''}</i>` : '';
    return `<span class="pw" data-code="${i.co.code}"><button class="st" data-fav="${i.co.code}" aria-label="즐겨찾기">★</button><span class="pc${i.g.strong ? ' s' : ''}" data-go="co-${i.co.code}" title="${esc(i.cat ? i.cat.t : '')}">${esc(i.co.name)}${y}${sigTag(i.cat)}</span></span>`; };
  const cell = (r, p) => '<td>' + r.items.filter(i => i.pos === p).sort((a, b) => (b.co.p ? b.co.p.r1m : 0) - (a.co.p ? a.co.p.r1m : 0)).map(chip).join('') + '</td>';
  return `<section id="map"><div class="wrap wide"><h2>섹터 × 포지션 지도</h2>
    <div class="plg"><span><span class="pc s">종목<i>+26%↑</i></span>고성장: 매출 YY +${Math.round(PZ.yoy * 100)}% 이상 또는 이익률 개선 +${PZ.threshold}%p 이상</span><span>숫자는 최근 분기 매출 YY, ↑↓는 이익률 0.5%p 이상 개선·악화</span><span><b style="color:#ff8f8f">▲</b> 연간 가이던스 상향 <b style="color:#7fb2ff">▼</b> 하향 <b style="color:var(--warn)">◆</b> 실적 외 이벤트</span><span><span class="pstar">주가·실적 일치</span>공격수·공미 절반 이상, 고성장 2개 이상</span></div>
    <div class="card" style="padding:8px 12px"><table class="pmap"><colgroup><col style="width:190px"><col style="width:17%"><col style="width:23%"><col style="width:25%"><col></colgroup>
    <thead><tr><th>섹터</th><th>공격수<small>비방어 업종, 실적으로 상승</small></th><th>공미<small>방어·내수지만 동종 대비 초과</small></th><th>수미<small>테마 묶음으로 동반 상승</small></th><th>수비수<small>덜 빠져서 고가 근처</small></th></tr></thead><tbody>
    ${rows.map(r => { const best = r.att / r.n >= 0.5 && r.sg >= 2;
      return `<tr class="${best ? 'best' : ''}"><td><div class="gn">${esc(r.g)}${best ? '<span class="pstar">주가·실적 일치</span>' : ''}</div><div class="gs">공격·공미 ${r.att}/${r.n} · 고성장 ${r.sg} · 1M ${pct(r.m1)}</div></td>${cell(r, 'FW')}${cell(r, 'AM')}${cell(r, 'DM')}${cell(r, 'DF')}</tr>`; }).join('')}
    </tbody></table></div>
    <p class="muted" style="margin-top:8px">칩을 누르면 종목 카드로 이동합니다. 매출 YY·이익률은 최근 분기와 전년 동기 비교(단일 분기)이며, 전년 동기가 적자였던 경우 이익률 개선은 고성장에서 제외했습니다. ${esc(PZ.src || '')}.</p>
  </div></section>`;
}


/* ───────── 즐겨찾기 (이 브라우저에만 저장) ───────── */
const FAV = {key: 'jpnh-fav', set: new Set(),
  load() { try { this.set = new Set(JSON.parse(localStorage.getItem(this.key) || '[]')); } catch (e) { this.set = new Set(); } },
  save() { try { localStorage.setItem(this.key, JSON.stringify([...this.set])); } catch (e) {} },
  toggle(c) { this.set.has(c) ? this.set.delete(c) : this.set.add(c); this.save(); }};
function paintFav() {
  document.querySelectorAll('.fav[data-fav]').forEach(b => { const on = FAV.set.has(b.dataset.fav); b.textContent = on ? '★' : '☆'; b.classList.toggle('on', on); });
  document.querySelectorAll('.pw[data-code]').forEach(p => p.classList.toggle('fv', FAV.set.has(p.dataset.code)));
}
async function main() {
  const [data, prices, etf, PZ] = await Promise.all([load('data/companies.json'), load('data/prices.json'), load('data/etf.json'), load('data/positions.json')]);
  const deck = $('#deck');
  if (!data) { deck.innerHTML = '<section><div class="wrap"><p class="sub">data/companies.json 을 불러오지 못했습니다.</p></div></section>'; return; }
  WEEKLY = !!(prices && prices.freq === 'W');
  const cos = data.companies.map(c => enrich(c, prices)); // 파일 순서 = 스크리너(시총) 순서
  deck.innerHTML = (etf && etf.etfs ? etfRank(etf) + etfPages(etf) : '') + cover(data, prices, cos) + (PZ ? mapPage(cos, PZ) : '') + listPage(cos) + cos.map((c, i) => card(c, i, cos.length, data.meta)).join('');
  cos.forEach(c => {
    if (!c.p) return;
    const box = $(`[data-price="${c.code}"]`), {svg, geo} = priceChart(c.p);
    box.insertAdjacentHTML('beforeend', svg); wirePrice(box, c.p, geo);
  });

  const secs = [...deck.querySelectorAll('section')], pos = $('#pos');
  const cur = () => { const t = deck.scrollTop + deck.clientHeight / 2; let k = 0; secs.forEach((s, i) => { if (s.offsetTop <= t) k = i; }); return k; };
  const go = i => secs[Math.max(0, Math.min(secs.length - 1, i))].scrollIntoView({behavior: 'smooth', block: 'start'});
  const upd = () => pos.textContent = (cur() + 1) + ' / ' + secs.length;
  if (location.hash) { const el = document.getElementById(location.hash.slice(1)); if (el) el.scrollIntoView({behavior: 'instant', block: 'start'}); }
  deck.addEventListener('scroll', upd, {passive: true}); upd();
  $('#next').onclick = () => go(cur() + 1); $('#prev').onclick = () => go(cur() - 1);
  document.addEventListener('keydown', e => {
    if (['ArrowDown', 'ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur() + 1); }
    else if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur() - 1); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(secs.length - 1); }
  });
  FAV.load(); paintFav();
  deck.addEventListener('click', e => { const fb = e.target.closest('[data-fav]'); if (fb) { FAV.toggle(fb.dataset.fav); paintFav(); return; }
    const tr = e.target.closest('[data-go]'); if (tr) document.getElementById(tr.dataset.go).scrollIntoView({behavior: 'smooth', block: 'start'}); });
}
main();
</script>
</body>
